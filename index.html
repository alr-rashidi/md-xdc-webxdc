<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MD-XDC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">MD-XDC</div>

  <div class="group group-media">
    <button class="btn" id="btn-insert" title="Insert media — images, video or audio">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-label">Insert</span>
    </button>

    <button class="btn" id="btn-media" title="Media library">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h5l2 2h9v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/></svg>
      <span class="btn-label">Media</span>
      <span class="count-badge" id="media-count" hidden></span>
    </button>

    <button class="btn icon" id="btn-dir" title="Toggle text direction (LTR / RTL)" aria-pressed="false">
      <svg class="ico ico-ltr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13"/><path d="m12 7 5 5-5 5"/><path d="M20 4v16"/></svg>
      <svg class="ico ico-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H8"/><path d="m12 7-5 5 5 5"/><path d="M4 4v16"/></svg>
    </button>
  </div>

  <div class="group group-view">
    <div class="seg">
      <button class="seg-btn" data-view="edit" title="Edit only" aria-label="Edit only">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="seg-btn active" data-view="split" title="Split view" aria-label="Split view">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg>
      </button>
      <button class="seg-btn" data-view="preview" title="Preview only" aria-label="Preview only">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn icon" id="btn-theme" title="Toggle theme">
      <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn primary" id="btn-export" title="Generate .xdc and send to chat">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span id="btn-export-label">Send .xdc</span>
    </button>
  </div>
</header>

<main class="main view-split" id="main">
  <section class="pane editor-pane">
    <div class="editor" id="editor" contenteditable="true" spellcheck="false" data-placeholder="# Type markdown here…"></div>
  </section>
  <div class="divider" id="divider" title="Drag to resize"></div>
  <section class="pane preview-pane">
    <article class="note" id="preview"></article>
  </section>
</main>

<!-- One picker for every kind: a mixed batch is fine because each file's kind is
     inferred from the file itself, not from which menu entry was used. -->
<input type="file" id="file-media" accept="image/*,video/*,audio/*" multiple hidden>

<div class="modal" id="media-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Media library</h2>
      <div class="modal-actions">
        <button class="btn danger" id="media-clear" title="Delete all media">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/></svg>
          Clear all
        </button>
        <button class="btn icon" id="media-close" title="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body" id="media-list"></div>
  </div>
</div>

<div class="modal" id="send-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Send .xdc</h2>
      <div class="modal-actions">
        <button class="btn icon" id="send-close" title="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <div class="warn-box" id="send-media-warn" hidden></div>
      <label class="field" for="app-name">
        <span>App name</span>
        <input type="text" id="app-name" maxlength="60" autocomplete="off" placeholder="MD-XDC">
      </label>
      <div class="field">
        <span id="icon-label">App icon — the default icon.png is included</span>
        <div class="icon-row">
          <div class="icon-preview" id="icon-preview"><span>none</span></div>
          <button class="btn" id="icon-pick">Choose image</button>
          <button class="btn" id="icon-default">Default</button>
        </div>
        <input type="file" id="icon-file" accept="image/*" hidden>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="send-cancel">Cancel</button>
      <button class="btn primary" id="send-confirm">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        <span>Send</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="webxdc.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
